name: Android TV app
on:
  push:
    paths: ["android-tv/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android-tv
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../retro-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: retro-tv-apk
          path: retro-tv.apk
      # A fixed download URL the TV can fetch directly (e.g. with the Downloader app):
      # https://github.com/<owner>/<repo>/releases/download/android-latest/retro-tv.apk
      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Android TV app (latest build)" \
              --notes "Built automatically from the default branch. Sideload retro-tv.apk on the Chromecast with Google TV."
          gh release upload android-latest retro-tv.apk --clobber
